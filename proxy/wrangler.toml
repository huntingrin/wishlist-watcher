name = "wishlist-watcher-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Public endpoint for testers.  *.workers.dev is SNI-blocked on mainland
# networks, so beta users go through this custom domain instead.
routes = [
  { pattern = "watch.huntingrin.com", custom_domain = true }
]

[durable_objects]
bindings = [{ name = "LIMITER", class_name = "RateLimiter" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[vars]
DAILY_LIMIT = "2000"
GLOBAL_QPS = "4"
CACHE_TTL_SECONDS = "300"
# Short-lived session credentials issued by POST /v1/session.
SESSION_TTL_DAYS = "30"
SESSION_PER_HOUR = "10"
