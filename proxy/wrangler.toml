name = "wishlist-watcher-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[durable_objects]
bindings = [{ name = "LIMITER", class_name = "RateLimiter" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[vars]
DAILY_LIMIT = "2000"
GLOBAL_QPS = "4"
CACHE_TTL_SECONDS = "300"
