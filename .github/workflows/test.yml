name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and CLI tests
        run: python -m unittest discover -s tests -v
      - name: Check for accidental secrets
        run: |
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude='*.example' -E 'HAINA_API_KEY=[A-Za-z0-9_-]{20,}' .; then
            echo "Potential secret found"
            exit 1
          fi

  proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx wrangler deploy --dry-run --outdir dist
